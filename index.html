<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">

<script>
  (function () {
    var raw = localStorage.getItem('tcsquiz.theme');
    var t;
    try { t = raw ? JSON.parse(raw) : null; } catch (_) { t = raw; }
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>

<header class="top">

    <a class="brand" href="#/"><b>TCS</b> Quiz <span>2026</span></a>

      <a href="#/search">Search</a>

    </nav>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">

    </button>
  </div>
</header>

<script type="module" src="./assets/js/app.js"></script>

</html>
