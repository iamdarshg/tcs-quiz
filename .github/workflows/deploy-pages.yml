name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 1: Build prep-library from source text (if source exists)
      - name: Build prep library from source
        run: |
          if [ -f data/source/tcs-quiz-prep.txt ] && [ -f scripts/build-prep-library.mjs ]; then
            node scripts/build-prep-library.mjs data/source/tcs-quiz-prep.txt data/prep-library.json
            echo "prep-library.json regenerated from source"
          else
            echo "Source text not found — using existing prep-library.json"
          fi

      # Step 2: Build index manifest from months/ and static/
      - name: Build index manifest
        run: node scripts/build-index.mjs

      # Step 3: Auto-generate module data from prep-library (the KEY pipeline)
      - name: Auto-generate module topics from library
        run: node scripts/build-prep-to-modules.mjs

      # Step 4: Generate Jekyll module pages
      - name: Generate module pages
        run: node scripts/generate-module-pages.mjs

      # Step 5: Create _data symlink for Jekyll (if not already present)
      - name: Prepare Jekyll data directory
        run: |
          if [ ! -L _data ] && [ ! -d _data ]; then
            ln -s data _data
          fi

      # Step 6: Build Jekyll site (uses bundled Jekyll, no Gemfile needed)
      - name: Build Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Step 7: Verify build output
      - name: Verify build
        run: |
          echo "=== Build output ==="
          ls -la _site/
          for f in modules.html revision.html library.html; do
            if [ -f "_site/$f" ]; then echo "OK: $f"; else echo "WARNING: $f missing"; fi
          done
          MOD_COUNT=$(ls _site/module/ 2>/dev/null | wc -l)
          echo "Module pages: $MOD_COUNT"
          echo "Build verification complete"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
