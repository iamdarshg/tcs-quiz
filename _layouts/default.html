<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b3155f'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<script>
(function () {
  var raw = localStorage.getItem('tcsquiz.theme');
  var t;
  try { t = raw ? JSON.parse(raw) : null; } catch (_) { t = raw; }
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="{{ site.baseurl }}/"><b>TCS</b> Quiz <span>2026</span></a>
    <nav class="nav" id="nav">
      <a href="{{ site.baseurl }}/">Dashboard</a>
      <a href="{{ site.baseurl }}/modules/">Modules</a>
      <a href="{{ site.baseurl }}/revision/">Revision</a>
      <a href="{{ site.baseurl }}/library/">Prep library</a>
      <a href="{{ site.baseurl }}/quiz/">Quiz</a>
      <a href="{{ site.baseurl }}/ultramap/">Maps</a>
      <a href="{{ site.baseurl }}/mymap/">My map</a>
      <a href="{{ site.baseurl }}/search/">Search</a>
      <a href="{{ site.baseurl }}/backup/">Backup</a>
    </nav>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
    </button>
  </div>
</header>

<main id="view" class="jekyll-content">
{{ content }}
</main>

<script>
// Wire theme toggle for Jekyll-built pages
document.getElementById('theme')?.addEventListener('click', function() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('tcsquiz.theme', JSON.stringify(next)); } catch(_) {}
});
</script>
</body>
</html>
